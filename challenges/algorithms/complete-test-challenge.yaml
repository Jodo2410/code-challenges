description: |
  This is a COMPLETE test challenge that meets ALL validation requirements.

  Problem: Given an array of numbers, return the sum of all even numbers.

  Examples:
  - Input: [1, 2, 3, 4, 5, 6] → Output: 12 (because 2 + 4 + 6 = 12)
  - Input: [1, 3, 5] → Output: 0 (no even numbers)
  - Input: [] → Output: 0 (empty array)

  This description is longer than 20 characters as required by validation.
difficulty: easy
category: algorithms
tags:
