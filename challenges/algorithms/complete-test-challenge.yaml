  - math
  - beginner-friendly
languages:
  - languageId: javascript
    starterCode: |
      /**
       * Sum of Even Numbers
       * @param {number[]} numbers - Array of integers
       * @return {number} Sum of all even numbers
       */
      function sumEvenNumbers(numbers) {
        // Your code here
        return 0;
      }

      if (typeof module !== 'undefined' && module.exports) {
        module.exports = { sumEvenNumbers };
      }
    solutionCode: |
      function sumEvenNumbers(numbers) {
        return numbers
          .filter(num => num % 2 === 0)
          .reduce((sum, num) => sum + num, 0);
      }

      if (typeof module !== 'undefined' && module.exports) {
        module.exports = { sumEvenNumbers };
      }
