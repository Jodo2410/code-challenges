          print(result)  # Should print 12
    solutionCode: |
      def sum_even_numbers(numbers):
          """
          Calculate sum of even numbers in the list
          """
          return sum(num for num in numbers if num % 2 == 0)

      if __name__ == "__main__":
          result = sum_even_numbers([1, 2, 3, 4, 5, 6])
          print(result)
