id: fibonacci-number
title: Fibonacci Number
description: |
  Calculate the nth Fibonacci number. The Fibonacci sequence is defined as:
  F(0) = 0, F(1) = 1, F(n) = F(n-1) + F(n-2) for n > 1.

  Implement an efficient solution that can handle large values of n.
difficulty: easy
category: algorithms
tags:
  - recursion
  - dynamic-programming
  - mathematics
languages:
  - languageId: javascript
    starterCode: |
      /**
       * Fibonacci Number
       * Calculate the nth Fibonacci number
       * @param {number} n
       * @return {number}
       */
      function fibonacci(n) {
        // Your code here
      }

      if (typeof module !== 'undefined' && module.exports) {
        module.exports = { fibonacci };
      }
    solutionCode: |
      function fibonacci(n) {
        if (n <= 1) return n;

        let a = 0, b = 1;
        for (let i = 2; i <= n; i++) {
          [a, b] = [b, a + b];
        }

        return b;
      }

      if (typeof module !== 'undefined' && module.exports) {
        module.exports = { fibonacci };
      }
