          :return: int - The nth Fibonacci number
          """
          # Your code here
          pass
    solutionCode: |
      def fibonacci(n: int) -> int:
          if n <= 1:
              return n

          a, b = 0, 1
          for _ in range(2, n + 1):
              a, b = b, a + b

          return b
