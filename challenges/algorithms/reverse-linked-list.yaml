id: reverse-linked-list
title: Reverse Linked List
description: |
  Given the head of a singly linked list, reverse the list and return the reversed list.

  Example:
  Input: 1 -> 2 -> 3 -> 4 -> 5
  Output: 5 -> 4 -> 3 -> 2 -> 1

  Input: 1 -> 2
  Output: 2 -> 1

  Input: []
  Output: []

  Challenge: Can you do it iteratively and recursively?
difficulty: easy
