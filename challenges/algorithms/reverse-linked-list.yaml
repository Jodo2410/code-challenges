    solutionCode: |
      class ListNode:
          def __init__(self, val=0, next=None):
              self.val = val
              self.next = next

      def reverse_list(head: ListNode) -> ListNode:
          prev = None
          current = head

          while current:
              next_temp = current.next
              current.next = prev
              prev = current
              current = next_temp

          return prev

      def create_list(arr):
          if not arr:
              return None
          head = ListNode(arr[0])
          current = head
          for val in arr[1:]:
              current.next = ListNode(val)
              current = current.next
          return head

      def list_to_array(head):
          result = []
          current = head
          while current:
              result.append(current.val)
              current = current.next
          return result
