          :param t: Second string
          :return: True if anagrams, False otherwise
          """
          # Your code here
          pass
    solutionCode: |
      def is_anagram(s: str, t: str) -> bool:
          if len(s) != len(t):
              return False

          count = {}

          # Count characters in s
          for char in s:
              count[char] = count.get(char, 0) + 1

          # Decrease count for characters in t
          for char in t:
              if char not in count:
                  return False
              count[char] -= 1
              if count[char] < 0:
                  return False

          return True
    testCases:
      - id: test-1
        description: Valid anagram
        input:
          s: "anagram"
          t: "nagaram"
        expectedOutput: true
      - id: test-2
        description: Not an anagram
        input:
          s: "rat"
          t: "car"
        expectedOutput: false
      - id: test-3
        description: Different lengths
        input:
          s: "hello"
          t: "world!"
        expectedOutput: false
      - id: test-4
        description: Empty strings
        input:
          s: ""
          t: ""
        expectedOutput: true
        hidden: true
      - id: test-5
        description: Single character
        input:
          s: "a"
          t: "a"
        expectedOutput: true
        hidden: true
    testConfig:
      runCommand: python3 {{testFile}}

