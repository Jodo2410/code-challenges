          """
          # Your code here
          pass
    solutionCode: |
      def is_valid(s: str) -> bool:
          stack = []
          pairs = {
              ')': '(',
              '}': '{',
              ']': '['
          }

          for char in s:
              if char in '({[':
                  stack.append(char)
              else:
                  if not stack or stack.pop() != pairs[char]:
                      return False

          return len(stack) == 0
    testCases:
      - id: test-1
        description: Simple valid parentheses
        input: "()"
        expectedOutput: true
      - id: test-2
        description: Multiple types valid
        input: "()[]{}"
        expectedOutput: true
      - id: test-3
        description: Wrong closing bracket
        input: "(]"
        expectedOutput: false
      - id: test-4
        description: Wrong order
        input: "([)]"
        expectedOutput: false
      - id: test-5
        description: Nested valid
        input: "{[]}"
        expectedOutput: true
      - id: test-6
        description: Only opening
        input: "((("
        expectedOutput: false
        hidden: true
      - id: test-7
        description: Only closing
        input: ")))"
