id: valid-parentheses
title: Valid Parentheses
description: |
  Given a string s containing just the characters '(', ')', '{', '}', '[' and ']',
  determine if the input string is valid.

  An input string is valid if:
  1. Open brackets must be closed by the same type of brackets.
  2. Open brackets must be closed in the correct order.
  3. Every close bracket has a corresponding open bracket of the same type.

  Example:
  Input: s = "()"
  Output: true

  Input: s = "()[]{}"
  Output: true

  Input: s = "(]"
  Output: false

  Input: s = "([)]"
  Output: false

  Input: s = "{[]}"
  Output: true
difficulty: easy
category: data-structures
tags:
  - stack
  - strings
  - parentheses
languages:
  - languageId: javascript
    starterCode: |
      /**
       * Valid Parentheses
       * Check if parentheses are valid and properly nested
       * @param {string} s
       * @return {boolean}
       */
      function isValid(s) {
        // Your code here
      }

      if (typeof module !== 'undefined' && module.exports) {
        module.exports = { isValid };
      }
    solutionCode: |
      function isValid(s) {
        const stack = [];
        const pairs = {
          ')': '(',
          '}': '{',
          ']': '['
        };

        for (let char of s) {
          if (char === '(' || char === '{' || char === '[') {
            stack.push(char);
          } else {
            if (stack.length === 0 || stack.pop() !== pairs[char]) {
              return false;
            }
          }
        }

        return stack.length === 0;
      }

      if (typeof module !== 'undefined' && module.exports) {
        module.exports = { isValid };
      }
    testCases:
      - id: test-1
        description: Simple valid parentheses
        input: "()"
        expectedOutput: true
      - id: test-2
        description: Multiple types valid
        input: "()[]{}"
        expectedOutput: true
      - id: test-3
        description: Wrong closing bracket
        input: "(]"
        expectedOutput: false
      - id: test-4
        description: Wrong order
        input: "([)]"
        expectedOutput: false
      - id: test-5
        description: Nested valid
        input: "{[]}"
        expectedOutput: true
      - id: test-6
        description: Only opening
        input: "((("
        expectedOutput: false
        hidden: true
      - id: test-7
        description: Only closing
        input: ")))"
        expectedOutput: false
        hidden: true
      - id: test-8
        description: Empty string
        input: ""
        expectedOutput: true
        hidden: true
    testConfig:
      runCommand: node {{testFile}}

  - languageId: python
    starterCode: |
