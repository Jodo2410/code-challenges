    solutionCode: |
      def find_missing_number(nums: list[int]) -> int:
          n = len(nums)
          # Sum of 0 to n
          expected_sum = n * (n + 1) // 2
          # Actual sum
          actual_sum = sum(nums)
          # Missing number
          return expected_sum - actual_sum
