id: binary-search
title: Binary Search
description: |
  Given a sorted array of integers nums and a target value,
  implement binary search to find the index of the target.
  If the target is not found, return -1.

  You must write an algorithm with O(log n) runtime complexity.

  Example:
  Input: nums = [-1, 0, 3, 5, 9, 12], target = 9
  Output: 4

  Input: nums = [-1, 0, 3, 5, 9, 12], target = 2
  Output: -1
difficulty: easy
category: algorithms
tags:
  - binary-search
  - arrays
  - divide-and-conquer
languages:
  - languageId: javascript
    starterCode: |
      /**
       * Binary Search
       * Find target in sorted array using binary search
       * @param {number[]} nums - Sorted array
       * @param {number} target - Target value
       * @return {number} - Index of target or -1
       */
      function binarySearch(nums, target) {
        // Your code here
      }

      if (typeof module !== 'undefined' && module.exports) {
        module.exports = { binarySearch };
      }
    solutionCode: |
      function binarySearch(nums, target) {
        let left = 0;
        let right = nums.length - 1;

        while (left <= right) {
          const mid = Math.floor((left + right) / 2);

          if (nums[mid] === target) {
            return mid;
          } else if (nums[mid] < target) {
            left = mid + 1;
          } else {
            right = mid - 1;
          }
        }

        return -1;
      }

      if (typeof module !== 'undefined' && module.exports) {
        module.exports = { binarySearch };
      }
    testCases:
      - id: test-1
        description: Target found in middle
        input:
          nums: [-1, 0, 3, 5, 9, 12]
