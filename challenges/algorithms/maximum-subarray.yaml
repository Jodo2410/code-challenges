        input: [5, 4, -1, 7, 8]
        expectedOutput: 23
      - id: test-4
        description: All negative
        input: [-3, -2, -5, -1]
        expectedOutput: -1
      - id: test-5
        description: Large array
        input: [1, 2, 3, 4, 5, -10, 6, 7, 8]
        expectedOutput: 21
