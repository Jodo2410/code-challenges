    solutionCode: |
      def max_sub_array(nums: list[int]) -> int:
          max_sum = nums[0]
          current_sum = nums[0]

          for i in range(1, len(nums)):
              # Either extend existing subarray or start new one
              current_sum = max(nums[i], current_sum + nums[i])
              max_sum = max(max_sum, current_sum)

          return max_sum
    testCases:
